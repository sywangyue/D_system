        0 20px 48px -8px rgba(0, 0, 0, 0.06);
    }

    .floating-anim-slow {
      animation: floatGentle 12s ease-in-out infinite;
    }

    .floating-anim-alt {
      animation: floatGentleAlt 14s ease-in-out infinite;
    }

    .floating-anim-subtle {
      animation: floatSubtle 16s ease-in-out infinite;
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.5deg); }
    }

    @keyframes floatGentleAlt {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-0.5deg); }
    }

    @keyframes floatSubtle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-anim-slow, .floating-anim-alt, .floating-anim-subtle {
        animation: none !important;
      }
    }

<div aria-live="assertive" class="hidden w-full mb-5 px-3.5 py-2.5 rounded-[4px] border border-[hsl(0,90%,92%)] bg-[hsl(0,100%,97%)] text-[hsl(358,66%,48%)] text-[12px] flex items-center space-x-2 transition-all duration-150" id="error-banner" role="alert">
<svg aria-hidden="true" class="w-4 h-4 flex-shrink-0" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" fill-rule="evenodd"></path>
</svg>
<span class="font-medium tracking-normal">邮箱或密码不正确</span>
</div>
<!-- BEGIN: LoginForm -->
<form class="w-full space-y-4" id="login-form" novalidate="" onsubmit="handleFormSubmit(event)">
<!-- Email Input Group -->
<div class="space-y-1.5 text-left">
<label class="block text-[12px] font-normal text-[#4d4d4d]" for="input-email">
            工作邮箱
          </label>
<input autocomplete="username" class="w-full h-[42px] px-3.5 bg-[#f2f2f2] border border-[rgba(0,0,0,0.08)] rounded-[4px] text-[13px] text-[#171717] placeholder-[#a8a8a8] focus:bg-white focus:border-[#171717] focus:ring-1 focus:ring-[#171717] transition-colors duration-150 outline-none" id="input-email" name="email" placeholder="name@mds.cn" required="" type="email"/>
</div>
<!-- Password Input Group -->
<div class="space-y-1.5 text-left">
<label class="block text-[12px] font-normal text-[#4d4d4d]" for="input-password">
            账号密码
          </label>
<input autocomplete="current-password" class="w-full h-[42px] px-3.5 bg-[#f2f2f2] border border-[rgba(0,0,0,0.08)] rounded-[4px] text-[13px] text-[#171717] placeholder-[#a8a8a8] focus:bg-white focus:border-[#171717] focus:ring-1 focus:ring-[#171717] transition-colors duration-150 outline-none" id="input-password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button: Strictly Black (#171717) Background with White Text -->
<div class="pt-2">
<button class="w-full h-[42px] bg-[#171717] text-white hover:bg-black rounded-[4px] text-[14px] font-medium tracking-wide flex items-center justify-center transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed" id="btn-submit" type="submit">
<span id="btn-text">登 录</span>
<!-- Spinner icon for loading state -->
<svg class="hidden animate-spin ml-2 h-4 w-4 text-white" fill="none" id="btn-spinner" viewbox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" fill="currentColor"></path>
</svg>
</button>
</div>
</form>
<!-- END: LoginForm -->
<!-- Bottom Hint Note: Unified internal distribution -->
<footer class="mt-6 text-center">
<p class="text-[12px] text-[#8f8f8f] tracking-normal font-normal">
          账号由管理员统一分配
        </p>
</footer>
</div>
</main>
<!-- END: MainContentWrapper -->
<!-- BEGIN: InteractiveStateSwitcher -->
<!-- Bottom Floating Switcher: Inspect the 4 mandatory states defined in prompt -->
<aside aria-label="设计验收状态切换器" class="relative z-20 pb-5 w-full flex flex-col items-center justify-center space-y-2" data-purpose="state-switcher">
<div class="bg-white/90 backdrop-blur-md px-2 py-1.5 rounded-full border border-[rgba(0,0,0,0.08)] shadow-sm flex items-center space-x-1 text-[11px]">
<span class="text-[#8f8f8f] px-2 font-mono">状态预览:</span>
<button class="state-btn active-state px-2.5 py-1 rounded-full text-[#171717] bg-[#f2f2f2] font-medium transition-all" id="tab-state-default" onclick="setDesignState('default')" type="button">
        ① 默认态
      </button>
<button class="state-btn px-2.5 py-1 rounded-full text-[#4d4d4d] hover:text-[#171717] hover:bg-[#fafafa] transition-all" id="tab-state-focused" onclick="setDesignState('focused')" type="button">
        ② 聚焦态
      </button>
<button class="state-btn px-2.5 py-1 rounded-full text-[#4d4d4d] hover:text-[#171717] hover:bg-[#fafafa] transition-all" id="tab-state-error" onclick="setDesignState('error')" type="button">
        ③ 错误态
      </button>
<button class="state-btn px-2.5 py-1 rounded-full text-[#4d4d4d] hover:text-[#171717] hover:bg-[#fafafa] transition-all" id="tab-state-loading" onclick="setDesignState('loading')" type="button">
        ④ 提交中
      </button>
</div>
</aside>
<!-- END: InteractiveStateSwitcher -->
<!-- BEGIN: StateControllerScript -->
<script data-purpose="interactive-state-management">
    function setDesignState(state) {
      const emailInput = document.getElementById('input-email');
      const passwordInput = document.getElementById('input-password');
      const errorBanner = document.getElementById('error-banner');
      const submitBtn = document.getElementById('btn-submit');
      const submitText = document.getElementById('btn-text');
      const submitSpinner = document.getElementById('btn-spinner');
      
      // Update Switcher tabs styling
      document.querySelectorAll('.state-btn').forEach(btn => {
        btn.classList.remove('bg-[#f2f2f2]', 'text-[#171717]', 'font-medium');
        btn.classList.add('text-[#4d4d4d]');
      });
      const activeBtn = document.getElementById(`tab-state-${state}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-[#f2f2f2]', 'text-[#171717]', 'font-medium');
        activeBtn.classList.remove('text-[#4d4d4d]');
      }

      // Reset base behaviors
      errorBanner.classList.add('hidden');
      emailInput.classList.remove('border-[hsl(358,66%,48%)]', 'bg-white', 'border-[#171717]');
      emailInput.classList.add('bg-[#f2f2f2]', 'border-[rgba(0,0,0,0.08)]');
      emailInput.removeAttribute('aria-invalid');
      
      submitBtn.disabled = false;
      submitSpinner.classList.add('hidden');
      submitText.textContent = '登 录';

      if (state === 'default') {
        emailInput.value = '';
        passwordInput.value = '';
        emailInput.blur();
      } else if (state === 'focused') {
        emailInput.value = 'alex.wang@mds.cn';
        passwordInput.value = '';
        emailInput.focus();
        emailInput.classList.remove('bg-[#f2f2f2]');
        emailInput.classList.add('bg-white', 'border-[#171717]');
      } else if (state === 'error') {
        emailInput.value = 'alex.wang@mds.cn';
        passwordInput.value = 'incorrect-password';
        errorBanner.classList.remove('hidden');
        emailInput.classList.remove('border-[rgba(0,0,0,0.08)]');
        emailInput.classList.add('border-[hsl(358,66%,48%)]');
        emailInput.setAttribute('aria-invalid', 'true');
      } else if (state === 'loading') {
        emailInput.value = 'alex.wang@mds.cn';
        passwordInput.value = 'valid-password';
        submitBtn.disabled = true;
        submitText.textContent = '登录中…';
        submitSpinner.classList.remove('hidden');
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      setDesignState('loading');
      setTimeout(() => {
        setDesignState('error');
      }, 1200);
    }

    function switchLocale(lang) {
      const zhBtn = document.getElementById('btn-lang-zh');
      const enBtn = document.getElementById('btn-lang-en');
      if (lang === 'zh') {
        zhBtn.className = 'font-medium text-[#171717] px-1 py-0.5 rounded transition-colors duration-150 hover:text-black focus:outline-none focus:ring-1 focus:ring-black';
        enBtn.className = 'text-[#8f8f8f] px-1 py-0.5 rounded transition-colors duration-150 hover:text-[#171717] focus:outline-none focus:ring-1 focus:ring-black';
      } else {
        enBtn.className = 'font-medium text-[#171717] px-1 py-0.5 rounded transition-colors duration-150 hover:text-black focus:outline-none focus:ring-1 focus:ring-black';
        zhBtn.className = 'text-[#8f8f8f] px-1 py-0.5 rounded transition-colors duration-150 hover:text-[#171717] focus:outline-none focus:ring-1 focus:ring-black';
      }
    }
  </script>
<!-- END: StateControllerScript -->
</body></html>
